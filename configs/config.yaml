# Phase 1 Configuration: Hallucination Detection Framework

project:
  name: "Medical Hallucination Detection Framework"
  phase: 1
  version: "0.1.0"
  seed: 42

domain:
  name: "Healthcare / Medical QA"
  reference_benchmarks:
    - "PatronusAI/HaluBench"
    - "ParticleMedia/RAGTruth"
    - "RUCAIBox/HaluEval"
  topics:
    - "Drug Dosage & Administration"
    - "Drug Interactions & Contraindications"
    - "Symptoms & Differential Diagnosis"
    - "Clinical Guidelines & Protocols"
    - "Study Citations & Evidence"
    - "Mechanism of Action & Pharmacology"

paths:
  raw_prompts: "data/raw/prompts.jsonl"
  reference_corpus: "data/raw/reference_corpus.jsonl"
  benchmark_full: "data/benchmark/benchmark_v0.1.jsonl"
  dev_split: "data/benchmark/dev_split.jsonl"
  test_split: "data/benchmark/test_split.jsonl"
  annotations_dir: "data/annotations"
  reports_dir: "outputs/reports"
  error_analysis_dir: "outputs/error_analysis"

generation:
  model_name: "meta-llama/Meta-Llama-3-8B-Instruct"  # or quantized/mock local fallback
  temperature: 0.8
  num_samples: 5
  max_new_tokens: 256
  seed: 42

claim_extraction:
  method: "hybrid_rule_llm"
  min_claim_length_chars: 15
  split_conjunctions: true

retrieval:
  top_k: 3
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cuda"

detector:
  self_consistency:
    nli_model: "cross-encoder/nli-deberta-v3-small"
    batch_size: 16
    default_threshold: 0.5
    device: "cuda"

evaluation:
  dev_split_ratio: 0.70
  test_split_ratio: 0.30
  double_annotated_sample_ratio: 0.20
  target_kappa_threshold: 0.70

